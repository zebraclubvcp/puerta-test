<!-- Firebase (compat SDK, sin build tools) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<!-- ZXing para escaneo de DNI (PDF417) -->
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
<!-- pdf.js para importar listas desde PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
/* ---------- Firebase init ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyDYjdQw1YS2fGOb5EmwNSk8X-mGOtlUduQ",
  authDomain: "zebra-puerta.firebaseapp.com",
  projectId: "zebra-puerta",
  storageBucket: "zebra-puerta.firebasestorage.app",
  messagingSenderId: "953302953272",
  appId: "1:953302953272:web:ffea2258d872b34a6d25cd"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

/* ---------- Estado global ---------- */
let evento = { nombreEvento: '', fecha: '', horaCorte: '02:00' };
let invitados = []; // cache local, sincronizado en vivo
let candidato = null; // { invitadoId, nombreCompleto, responsable, tipo, edad, dniRaw, matchScore }
let gruposExpandido = {}; // key -> bool, qué grupos de "Pendientes" están desplegados

/* ---------- Utils ---------- */
function normalizar(str) {
  return (str || '')
    .toString()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase()
    .replace(/[^a-z0-9\s]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}
function tokens(str) { return normalizar(str).split(' ').filter(Boolean); }

// ¿"a" y "b" son la misma palabra o una es un apodo/abreviación de la otra?
// (ej: "manu" vs "manuel", "male" vs "malena") — exige al menos 3 letras en común
// para evitar falsos positivos entre nombres cortos distintos.
function esApodoDe(a, b) {
  if (!a || !b) return false;
  if (a === b) return true;
  const corta = a.length <= b.length ? a : b;
  const larga = a.length <= b.length ? b : a;
  if (corta.length < 3) return false;
  return larga.startsWith(corta);
}

// Matching robusto DNI ⇄ nombre cargado en la lista:
// - el APELLIDO tiene que aparecer sí o sí (no se abrevia) → filtra cruces entre apellidos distintos
// - el NOMBRE tolera apodos/versiones cortas, porque nadie anota su nombre legal completo en una lista
// Devuelve null si no hay ningún indicio de apellido en común (no es candidato).
function matchScoreDetallado(apellidoTokensDni, nombreTokensDni, nombreCompletoLista) {
  const invTokens = tokens(nombreCompletoLista);
  if (!invTokens.length || !apellidoTokensDni.length) return null;

  const usados = new Set();
  let apellidoHits = 0;
  apellidoTokensDni.forEach(t => {
    const idx = invTokens.findIndex((it, i) => it === t && !usados.has(i));
    if (idx !== -1) { apellidoHits++; usados.add(idx); }
  });
  if (apellidoHits === 0) return null; // ningún apellido coincide: no es candidato

  const apellidoRatio = apellidoHits / apellidoTokensDni.length;
  const restantes = invTokens.filter((_, i) => !usados.has(i));

  let nombreHits = 0;
  nombreTokensDni.forEach(nt => {
    if (restantes.some(rt => esApodoDe(nt, rt))) nombreHits++;
  });
  const nombreRatio = nombreTokensDni.length ? nombreHits / nombreTokensDni.length : 1;

  const score = apellidoRatio * 0.65 + nombreRatio * 0.35;
  return { score, apellidoRatio, nombreRatio, apellidoHits };
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function calcularEdad(fechaDDMMYYYY) {
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec((fechaDDMMYYYY || '').trim());
  if (!m) return null;
  const [_, dd, mm, yyyy] = m;
  const nacimiento = new Date(Number(yyyy), Number(mm) - 1, Number(dd));
  if (isNaN(nacimiento.getTime())) return null;
  const hoy = new Date();
  let edad = hoy.getFullYear() - nacimiento.getFullYear();
  const noCumplioAun = hoy.getMonth() < nacimiento.getMonth() ||
    (hoy.getMonth() === nacimiento.getMonth() && hoy.getDate() < nacimiento.getDate());
  if (noCumplioAun) edad--;
  return edad;
}

function excedeHorario(horaCorteStr) {
  if (!horaCorteStr) return false;
  const now = new Date();
  const h = now.getHours(), min = now.getMinutes();
  if (h >= 12) return false; // tarde/noche, todavía no llegó el corte de la madrugada
  const parts = horaCorteStr.split(':').map(Number);
  const corteMin = parts[0] * 60 + (parts[1] || 0);
  const nowMin = h * 60 + min;
  return nowMin > corteMin;
}

function parseDniPdf417(raw) {
  const parts = raw.split('@');
  return {
    tramite: parts[0] || '',
    apellido: parts[1] || '',
    nombre: parts[2] || '',
    sexo: parts[3] || '',
    dni: parts[4] || '',
    ejemplar: parts[5] || '',
    fechaNacimiento: parts[6] || '',
    fechaEmision: parts[7] || '',
    raw
  };
}

/* ---------- Tabs ---------- */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-' + btn.dataset.view).classList.add('active');
  });
});
document.getElementById('view-carga').classList.add('active');

/* ---------- Config del evento ---------- */
db.collection('config').doc('evento').onSnapshot(doc => {
  if (doc.exists) {
    evento = doc.data();
    document.getElementById('cfgNombre').value = evento.nombreEvento || '';
    document.getElementById('cfgHora').value = evento.horaCorte || '02:00';
    document.getElementById('eventoInfo').textContent =
      (evento.nombreEvento || 'Sin nombre') + ' · corte RRPP ' + (evento.horaCorte || '--:--');
  } else {
    document.getElementById('eventoInfo').textContent = 'Configurá el evento en la pestaña Carga';
  }
});

document.getElementById('btnGuardarEvento').addEventListener('click', () => {
  const nombreEvento = document.getElementById('cfgNombre').value.trim();
  const horaCorte = document.getElementById('cfgHora').value;
  const fecha = new Date().toISOString().slice(0, 10);
  db.collection('config').doc('evento').set({ nombreEvento, horaCorte, fecha }, { merge: true })
    .then(() => {
      document.getElementById('cfgStatus').textContent = 'Evento guardado.';
      document.getElementById('cfgStatus').className = 'status-msg ok';
    })
    .catch(e => {
      document.getElementById('cfgStatus').textContent = 'Error: ' + e.message;
      document.getElementById('cfgStatus').className = 'status-msg err';
    });
});

/* ---------- Carga de listas ---------- */
document.getElementById('btnAgregarLista').addEventListener('click', () => {
  const responsable = document.getElementById('nuevoResponsable').value.trim();
  const tipo = document.getElementById('nuevoTipo').value;
  const raw = document.getElementById('nuevosNombres').value;
  const lineas = raw.split('\n').map(l => l.trim()).filter(Boolean);
  const statusEl = document.getElementById('cargaStatus');

  if (!responsable) {
    statusEl.textContent = 'Falta el nombre del responsable.';
    statusEl.className = 'status-msg err';
    return;
  }
  if (!lineas.length) {
    statusEl.textContent = 'Cargá al menos un nombre.';
    statusEl.className = 'status-msg err';
    return;
  }

  const batch = db.batch();
  lineas.forEach(nombreCompleto => {
    const ref = db.collection('invitados').doc();
    batch.set(ref, {
      nombreCompleto,
      responsable,
      tipo,
      estado: 'pendiente',
      horaIngreso: null,
      dni: null,
      edadCalculada: null,
      creadoEn: firebase.firestore.FieldValue.serverTimestamp()
    });
  });
  batch.commit().then(() => {
    statusEl.textContent = lineas.length + ' persona(s) agregada(s) a la lista de ' + responsable + '.';
    statusEl.className = 'status-msg ok';
    document.getElementById('nuevosNombres').value = '';
  }).catch(e => {
    statusEl.textContent = 'Error: ' + e.message;
    statusEl.className = 'status-msg err';
  });
});

/* ---------- Importar lista desde PDF ---------- */
document.getElementById('btnImportarPdf').addEventListener('click', () => {
  document.getElementById('inputPdfLista').click();
});

document.getElementById('inputPdfLista').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const statusEl = document.getElementById('cargaStatus');
  if (!window.pdfjsLib) {
    statusEl.textContent = 'No se pudo cargar el lector de PDF (revisá la conexión a internet).';
    statusEl.className = 'status-msg err';
    return;
  }
  statusEl.textContent = 'Leyendo PDF...';
  statusEl.className = 'status-msg';
  try {
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let lineas = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      const porLinea = {};
      content.items.forEach(it => {
        const y = Math.round(it.transform[5]);
        if (!porLinea[y]) porLinea[y] = [];
        porLinea[y].push(it.str);
      });
      Object.keys(porLinea).sort((a, b) => b - a).forEach(y => {
        const texto = porLinea[y].join(' ').replace(/\s+/g, ' ').trim();
        if (texto) lineas.push(texto);
      });
    }
    // limpia numeración ("1.", "1)", "-") y descarta líneas muy cortas (probable basura/encabezado)
    const nombres = lineas
      .map(l => l.replace(/^\s*\d+[.)\-:]?\s*/, '').trim())
      .filter(l => l.length >= 3);

    if (!nombres.length) {
      statusEl.textContent = 'No se pudo extraer texto del PDF (¿es una foto o un escaneo? probá con uno exportado como texto).';
      statusEl.className = 'status-msg err';
      return;
    }
    const textarea = document.getElementById('nuevosNombres');
    textarea.value = (textarea.value.trim() ? textarea.value.trim() + '\n' : '') + nombres.join('\n');
    statusEl.textContent = nombres.length + ' nombre(s) detectados del PDF. Revisá la lista antes de agregarla (corregí lo que haga falta) y después tocá "+ Agregar a la lista".';
    statusEl.className = 'status-msg ok';
  } catch (err) {
    statusEl.textContent = 'Error leyendo el PDF: ' + err.message;
    statusEl.className = 'status-msg err';
  }
});

function renderPendientes() {
  const pendientes = invitados.filter(i => i.estado === 'pendiente');
  document.getElementById('totalPendientes').textContent = pendientes.length;
  const cont = document.getElementById('listaPendientes');
  if (!pendientes.length) {
    cont.innerHTML = '<div class="muted">Sin gente cargada todavía.</div>';
    return;
  }
  const grupos = {};
  pendientes.forEach(p => {
    const key = p.responsable + '||' + p.tipo;
    if (!grupos[key]) grupos[key] = [];
    grupos[key].push(p);
  });
  let html = '';
  Object.keys(grupos).sort().forEach(key => {
    const [responsable, tipo] = key.split('||');
    const items = grupos[key];
    const abierto = !!gruposExpandido[key];
    html += `<div class="responsable-group">
      <div class="grupo-header" data-key="${escapeAttr(key)}">
        <h3>${escapeHtml(responsable)} <span class="tag ${tipo === 'rrpp' ? 'tag-rrpp' : 'tag-dueno'}">${tipo === 'rrpp' ? 'RRPP' : 'DUEÑO'}</span></h3>
        <span class="grupo-right">
          <span class="grupo-count">${items.length} ${items.length === 1 ? 'persona' : 'personas'}<span class="chevron">${abierto ? '▲' : '▼'}</span></span>
          <button class="x-btn grupo-del-btn" data-key="${escapeAttr(key)}" title="Borrar toda esta lista">🗑</button>
        </span>
      </div>`;
    if (abierto) {
      html += '<div class="grupo-items">';
      items.forEach(p => {
        html += `<div class="list-item"><span>${escapeHtml(p.nombreCompleto)}</span><button class="x-btn" data-id="${p.id}" title="Quitar">✕</button></div>`;
      });
      html += '</div>';
    }
    html += '</div>';
  });
  cont.innerHTML = html;
  cont.querySelectorAll('.grupo-header').forEach(h => {
    h.addEventListener('click', () => {
      const key = h.dataset.key;
      gruposExpandido[key] = !gruposExpandido[key];
      renderPendientes();
    });
  });
  cont.querySelectorAll('.x-btn[data-id]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      db.collection('invitados').doc(btn.dataset.id).delete();
    });
  });
  cont.querySelectorAll('.grupo-del-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const key = btn.dataset.key;
      const [responsable, tipo] = key.split('||');
      const items = invitados.filter(i => i.estado === 'pendiente' && i.responsable === responsable && i.tipo === tipo);
      if (!items.length) return;
      const ok = confirm('¿Borrar toda la lista de ' + responsable + ' (' + items.length + (items.length === 1 ? ' persona' : ' personas') + ')? No se puede deshacer.');
      if (!ok) return;
      const batch = db.batch();
      items.forEach(i => batch.delete(db.collection('invitados').doc(i.id)));
      batch.commit()
        .then(() => showToast('Lista de ' + responsable + ' borrada.'))
        .catch(e => showToast('Error: ' + e.message));
    });
  });
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
function escapeAttr(str) {
  return escapeHtml(str).replace(/"/g, '&quot;');
}

/* ---------- Sincronización en vivo de invitados ---------- */
db.collection('invitados').onSnapshot(snap => {
  invitados = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderPendientes();
  renderResumen();
  if (document.getElementById('buscarManualBox').style.display !== 'none') {
    renderBusquedaManual();
  }
});

/* ---------- Resumen en vivo ---------- */
function renderResumen() {
  const ingresados = invitados.filter(i => i.estado === 'ingresado');
  document.getElementById('totalIngresado').textContent = ingresados.length;
  const cont = document.getElementById('resumenPorResponsable');
  if (!ingresados.length) {
    cont.innerHTML = '<div class="muted">Todavía no hay ingresos.</div>';
    return;
  }
  const counts = {};
  ingresados.forEach(i => {
    const key = i.responsable + '||' + i.tipo;
    counts[key] = (counts[key] || 0) + 1;
  });
  const rows = Object.keys(counts).map(key => {
    const [responsable, tipo] = key.split('||');
    return { responsable, tipo, count: counts[key] };
  }).sort((a, b) => b.count - a.count);
  cont.innerHTML = rows.map(r =>
    `<div class="resumen-row"><span>${escapeHtml(r.responsable)} <span class="tag ${r.tipo === 'rrpp' ? 'tag-rrpp' : 'tag-dueno'}">${r.tipo === 'rrpp' ? 'RRPP' : 'DUEÑO'}</span></span><span class="resumen-count">${r.count}</span></div>`
  ).join('');
}

/* ---------- Exportar / compartir resumen ---------- */
function generarTextoResumen() {
  // para el texto compartido no importa si la lista era RRPP o dueño/encargado,
  // solo nombre y cantidad total ingresada por esa persona
  const ingresados = invitados.filter(i => i.estado === 'ingresado');
  const counts = {};
  ingresados.forEach(i => {
    counts[i.responsable] = (counts[i.responsable] || 0) + 1;
  });
  const rows = Object.keys(counts)
    .map(responsable => ({ responsable, count: counts[responsable] }))
    .sort((a, b) => b.count - a.count);

  let txt = '🦓 Zebra Club';
  if (evento.nombreEvento) txt += ' — ' + evento.nombreEvento;
  txt += '\n';
  if (evento.fecha) txt += 'Fecha: ' + evento.fecha + '\n';
  txt += 'Resumen de ingresos por lista\n\n';
  if (!rows.length) {
    txt += '(todavía no hay ingresos)\n';
  } else {
    rows.forEach(r => {
      txt += r.responsable + ': ' + r.count + '\n';
    });
  }
  txt += '\nTOTAL: ' + ingresados.length;
  return txt;
}

function descargarResumenTxt(txt) {
  const blob = new Blob([txt], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'resumen-zebra-' + (evento.fecha || new Date().toISOString().slice(0, 10)) + '.txt';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

document.getElementById('btnCopiarResumen').addEventListener('click', async () => {
  const txt = generarTextoResumen();
  try {
    await navigator.clipboard.writeText(txt);
    showToast('Resumen copiado — pegalo donde lo quieras enviar');
  } catch (e) {
    descargarResumenTxt(txt);
    showToast('No se pudo copiar, se descargó como archivo');
  }
});

document.getElementById('btnDescargarResumen').addEventListener('click', () => {
  descargarResumenTxt(generarTextoResumen());
});

/* ---------- Búsqueda manual (fallback) ---------- */
document.getElementById('btnBuscarManual').addEventListener('click', () => {
  const box = document.getElementById('buscarManualBox');
  box.style.display = box.style.display === 'none' ? 'block' : 'none';
  if (box.style.display === 'block') renderBusquedaManual();
});
document.getElementById('inputBuscar').addEventListener('input', renderBusquedaManual);

function renderBusquedaManual() {
  const q = normalizar(document.getElementById('inputBuscar').value);
  const cont = document.getElementById('resultadosBusqueda');
  if (!q) { cont.innerHTML = ''; return; }
  const pendientes = invitados.filter(i => i.estado === 'pendiente');
  const results = pendientes.filter(p => normalizar(p.nombreCompleto).includes(q)).slice(0, 8);
  if (!results.length) {
    cont.innerHTML = '<div class="muted" style="margin-top:6px;">Sin coincidencias.</div>';
    return;
  }
  cont.innerHTML = results.map(p =>
    `<div class="search-result" data-id="${p.id}">${escapeHtml(p.nombreCompleto)} <span class="tag ${p.tipo === 'rrpp' ? 'tag-rrpp' : 'tag-dueno'}">${p.tipo === 'rrpp' ? 'RRPP' : 'DUEÑO'}</span> · ${escapeHtml(p.responsable)}</div>`
  ).join('');
  cont.querySelectorAll('.search-result').forEach(el => {
    el.addEventListener('click', () => {
      const inv = invitados.find(i => i.id === el.dataset.id);
      document.getElementById('buscarManualBox').style.display = 'none';
      document.getElementById('scanStatus').textContent = 'Seleccionado: ' + inv.nombreCompleto + '. Ahora escaneá su DNI para confirmar identidad y edad.';
      document.getElementById('scanStatus').className = 'status-msg';
      preseleccion = inv; // se completará con el escaneo
      iniciarEscaneo();
    });
  });
}

/* ---------- Escaneo DNI (ZXing) ---------- */
let preseleccion = null; // invitado elegido manualmente, pendiente de escaneo
const { BrowserMultiFormatReader, BarcodeFormat, DecodeHintType } = ZXing;
const hints = new Map();
hints.set(DecodeHintType.POSSIBLE_FORMATS, [BarcodeFormat.PDF_417]);
const reader = new BrowserMultiFormatReader(hints);
let currentStream = null;

document.getElementById('btnEscanear').addEventListener('click', () => { preseleccion = null; iniciarEscaneo(); });

function iniciarEscaneo() {
  const video = document.getElementById('video');
  const statusEl = document.getElementById('scanStatus');
  video.style.display = 'block';
  statusEl.textContent = 'Pidiendo acceso a la cámara...';
  statusEl.className = 'status-msg';

  reader.decodeFromConstraints(
    { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } },
    video,
    (result, err) => {
      if (result) {
        const parsed = parseDniPdf417(result.getText());
        onDniEscaneado(parsed);
      }
    }
  ).then(() => {
    statusEl.textContent = 'Cámara activa. Apuntá al código de barras de atrás del DNI.';
    currentStream = video.srcObject;
    activarLinterna();
  }).catch(e => {
    statusEl.textContent = 'Error al acceder a la cámara: ' + e.message;
    statusEl.className = 'status-msg err';
  });
}

function activarLinterna() {
  if (!currentStream) return;
  const track = currentStream.getVideoTracks()[0];
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  const btnTorch = document.getElementById('btnTorch');
  if (caps.torch) {
    btnTorch.style.display = 'block';
    let on = false;
    btnTorch.onclick = () => {
      on = !on;
      track.applyConstraints({ advanced: [{ torch: on }] }).catch(() => {});
      btnTorch.textContent = on ? '🔦 Apagar linterna' : '🔦 Linterna';
    };
  }
}

function detenerEscaneo() {
  try { reader.reset(); } catch (e) {}
  document.getElementById('video').style.display = 'none';
  document.getElementById('btnTorch').style.display = 'none';
}

function onDniEscaneado(dni) {
  detenerEscaneo();
  const edad = calcularEdad(dni.fechaNacimiento);
  const statusEl = document.getElementById('scanStatus');

  if (preseleccion) {
    // ya eligieron manualmente a quién es, solo falta la edad/identidad del DNI
    mostrarCandidato(preseleccion, edad, dni, 1);
    statusEl.textContent = '';
    return;
  }

  // matching automático contra pendientes: el apellido tiene que coincidir sí o sí,
  // el nombre tolera apodos/versiones cortas (nadie anota su nombre legal completo en una lista)
  const apellidoTokens = tokens(dni.apellido);
  const nombreTokens = tokens(dni.nombre);
  const pendientes = invitados.filter(i => i.estado === 'pendiente');
  const candidatos = pendientes
    .map(p => {
      const m = matchScoreDetallado(apellidoTokens, nombreTokens, p.nombreCompleto);
      return m ? { p, ...m } : null;
    })
    .filter(Boolean)
    .sort((a, b) => b.score - a.score);

  if (!candidatos.length) {
    statusEl.innerHTML = '❌ No aparece en ninguna lista (' + escapeHtml(dni.apellido + ' ' + dni.nombre) + ', ' + (edad !== null ? edad + ' años' : 'edad no calculada') + '). Probá "Buscar por nombre".';
    statusEl.className = 'status-msg err';
    return;
  }

  // si hay más de una persona posible y no está claro cuál es (puntajes parecidos),
  // dejamos que el fiscalizador elija a mano en vez de adivinar
  const top = candidatos[0];
  const segundo = candidatos[1];
  const ambiguo = !!segundo && (top.score - segundo.score) < 0.2;

  if (!ambiguo) {
    mostrarCandidato(top.p, edad, dni, top.score);
  } else {
    mostrarMultiplesCandidatos(candidatos, edad, dni);
  }
}

function mostrarMultiplesCandidatos(candidatos, edad, dni) {
  document.getElementById('scanStatus').textContent = '';
  document.getElementById('candidatoTitle').textContent = 'Hay más de una coincidencia';
  document.getElementById('candidatoCard').style.display = 'block';
  document.getElementById('candidatoInfo').innerHTML =
    `<div class="muted">DNI escaneado: <strong>${escapeHtml(dni.apellido + ' ' + dni.nombre)}</strong>${edad !== null ? ' · ' + edad + ' años' : ''}. Elegí a quién corresponde:</div>`;
  const checklistEl = document.getElementById('candidatoChecklist');
  checklistEl.innerHTML = candidatos.slice(0, 6).map((c, idx) =>
    `<div class="search-result" data-idx="${idx}">${escapeHtml(c.p.nombreCompleto)} <span class="tag ${c.p.tipo === 'rrpp' ? 'tag-rrpp' : 'tag-dueno'}">${c.p.tipo === 'rrpp' ? 'RRPP' : 'DUEÑO'}</span> · ${escapeHtml(c.p.responsable)}</div>`
  ).join('');
  document.getElementById('btnConfirmarIngreso').style.display = 'none';
  checklistEl.querySelectorAll('.search-result').forEach(el => {
    el.addEventListener('click', () => {
      const c = candidatos[Number(el.dataset.idx)];
      mostrarCandidato(c.p, edad, dni, c.score);
    });
  });
}

function mostrarCandidato(inv, edad, dni, score) {
  candidato = { invitado: inv, edad, dni, score };
  document.getElementById('candidatoTitle').textContent = 'Datos encontrados';
  document.getElementById('candidatoCard').style.display = 'block';
  document.getElementById('btnConfirmarIngreso').style.display = 'block';
  const tipo = inv.tipo;
  const infoEl = document.getElementById('candidatoInfo');
  infoEl.innerHTML = `
    <div class="list-item"><span>Nombre en lista</span><strong>${escapeHtml(inv.nombreCompleto)}</strong></div>
    <div class="list-item"><span>Responsable</span><strong>${escapeHtml(inv.responsable)} <span class="tag ${tipo === 'rrpp' ? 'tag-rrpp' : 'tag-dueno'}">${tipo === 'rrpp' ? 'RRPP' : 'DUEÑO'}</span></strong></div>
    ${dni.apellido ? `<div class="list-item"><span>DNI escaneado</span><strong>${escapeHtml(dni.apellido + ' ' + dni.nombre)}</strong></div>` : ''}
    <div class="list-item"><span>Edad</span><strong>${edad !== null ? edad + ' años' : 'no calculada'}</strong></div>
  `;

  const checklistEl = document.getElementById('candidatoChecklist');
  let bloqueaIngreso = false;
  let html = '';

  if (tipo === 'rrpp') {
    const edadOk = edad !== null && edad >= 20;
    html += `<div class="list-item"><span>Requisito +20 años</span><span class="badge ${edadOk ? 'badge-ok' : 'badge-no'}">${edadOk ? 'OK' : 'NO CUMPLE'}</span></div>`;
    if (!edadOk) bloqueaIngreso = true;

    const excedido = excedeHorario(evento.horaCorte);
    html += `<div class="list-item"><span>Horario (corte ${escapeHtml(evento.horaCorte || '--:--')})</span><span class="badge ${!excedido ? 'badge-ok' : 'badge-no'}">${!excedido ? 'OK' : 'FUERA DE HORARIO'}</span></div>`;
    if (excedido) bloqueaIngreso = true;

    html += `<div class="checkline"><input type="checkbox" id="chkVcp"><label for="chkVcp" style="margin:0;">Confirmo verbalmente que es de Carlos Paz o alrededores</label></div>`;
  } else {
    html += `<div class="muted">Lista de dueño/encargado — sin restricciones de edad ni horario.</div>`;
  }
  checklistEl.innerHTML = html;

  const btnConfirmar = document.getElementById('btnConfirmarIngreso');
  function actualizarBoton() {
    if (tipo === 'rrpp') {
      const chk = document.getElementById('chkVcp');
      btnConfirmar.disabled = bloqueaIngreso || !chk.checked;
    } else {
      btnConfirmar.disabled = false;
    }
  }
  actualizarBoton();
  if (tipo === 'rrpp') {
    document.getElementById('chkVcp').addEventListener('change', actualizarBoton);
  }
}

document.getElementById('btnCancelarCandidato').addEventListener('click', () => {
  candidato = null;
  preseleccion = null;
  document.getElementById('candidatoCard').style.display = 'none';
  document.getElementById('btnConfirmarIngreso').style.display = 'block';
});

document.getElementById('btnConfirmarIngreso').addEventListener('click', () => {
  if (!candidato) return;
  const { invitado, edad, dni } = candidato;
  db.collection('invitados').doc(invitado.id).update({
    estado: 'ingresado',
    horaIngreso: Date.now(),
    edadCalculada: edad,
    dni: dni ? { apellido: dni.apellido, nombre: dni.nombre, dni: dni.dni } : null
  }).then(() => {
    showToast('✅ Ingreso confirmado: ' + invitado.nombreCompleto);
    candidato = null;
    preseleccion = null;
    document.getElementById('candidatoCard').style.display = 'none';
    document.getElementById('scanStatus').textContent = '';
  }).catch(e => {
    showToast('Error: ' + e.message);
  });
});
</script>
