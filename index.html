<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Zebra Club — Control de Puerta</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, system-ui, sans-serif;
    background: #f0f2f0;
    color: #1a1a1a;
    padding-bottom: 76px;
  }
  header {
    background: #fff;
    padding: 14px 16px 10px;
    border-bottom: 1px solid #e4e6e4;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  header h1 { font-size: 17px; margin: 0; }
  header .evento-info { font-size: 12px; color: #888; margin-top: 2px; }
  main { padding: 14px; max-width: 560px; margin: 0 auto; }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .card h2 { font-size: 15px; margin: 0 0 10px; }
  label { display: block; font-size: 12px; color: #666; margin: 10px 0 4px; }
  input[type=text], input[type=time], select, textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #dcdedc;
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    background: #fafafa;
  }
  textarea { min-height: 90px; resize: vertical; }
  button {
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    padding: 12px;
  }
  .btn-primary { background: #3a9e5f; color: #fff; width: 100%; margin-top: 10px; }
  .btn-primary:disabled { background: #b9dcc4; cursor: not-allowed; }
  .btn-secondary { background: #e4e6e4; color: #333; width: 100%; margin-top: 8px; }
  .btn-danger { background: #fbe0dc; color: #c0392b; }
  .btn-sm { padding: 6px 10px; font-size: 13px; }
  video { width: 100%; border-radius: 10px; background: #000; display: block; margin-top: 10px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .tabbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    background: #fff;
    border-top: 1px solid #e4e6e4;
    z-index: 30;
  }
  .tabbar button {
    flex: 1;
    background: none;
    border-radius: 0;
    padding: 12px 4px;
    font-size: 12px;
    font-weight: 600;
    color: #999;
    margin: 0;
  }
  .tabbar button.active { color: #3a9e5f; }
  .tabbar button .ico { display: block; font-size: 18px; margin-bottom: 2px; }
  .view { display: none; }
  .view.active { display: block; }
  .list-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #eee;
    font-size: 14px;
  }
  .list-item:last-child { border-bottom: none; }
  .tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 10px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .tag-rrpp { background: #e3edfb; color: #2b5b9a; }
  .tag-dueno { background: #f3e6fb; color: #7a2b9a; }
  .badge-ok { background: #dcf5e3; color: #2b7a43; }
  .badge-no { background: #fbe0dc; color: #c0392b; }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
  }
  .muted { color: #999; font-size: 13px; }
  .responsable-group { margin-bottom: 14px; }
  .responsable-group h3 { font-size: 13px; margin: 0 0 4px; color: #555; }
  .x-btn { background: none; border: none; color: #c0392b; font-size: 16px; padding: 0 6px; cursor: pointer; }
  .resumen-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
  }
  .resumen-row:last-child { border-bottom: none; }
  .resumen-count { font-size: 22px; font-weight: 700; color: #3a9e5f; }
  .search-result {
    padding: 10px;
    border: 1px solid #eee;
    border-radius: 8px;
    margin-top: 6px;
    cursor: pointer;
  }
  .search-result:active { background: #f5f5f5; }
  .checkline { display: flex; align-items: center; gap: 8px; margin: 10px 0; font-size: 14px; }
  .checkline input { width: auto; }
  .status-msg { font-size: 13px; margin-top: 8px; min-height: 18px; }
  .status-msg.err { color: #c0392b; }
  .status-msg.ok { color: #3a9e5f; font-weight: 600; }
  .toast {
    position: fixed;
    top: 70px; left: 50%; transform: translateX(-50%);
    background: #1a1a1a; color: #fff;
    padding: 10px 18px; border-radius: 20px;
    font-size: 14px; z-index: 100;
    opacity: 0; transition: opacity .2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>🦓 Zebra Club — Control de Puerta</h1>
  <div class="evento-info" id="eventoInfo">Cargando evento...</div>
</header>

<main>

  <!-- VISTA CARGA -->
  <div class="view" id="view-carga">
    <div class="card">
      <h2>Evento de esta noche</h2>
      <label>Nombre del evento</label>
      <input type="text" id="cfgNombre" placeholder="Ej: Sábado Kosmos">
      <label>Horario de corte para listas de RRPP</label>
      <input type="time" id="cfgHora" value="02:00">
      <button class="btn-primary" id="btnGuardarEvento">Guardar evento</button>
      <div class="status-msg" id="cfgStatus"></div>
    </div>

    <div class="card">
      <h2>Cargar lista</h2>
      <label>Responsable (nombre del RRPP o dueño/encargado)</label>
      <input type="text" id="nuevoResponsable" placeholder="Ej: Juan Martín">
      <label>Tipo de lista</label>
      <select id="nuevoTipo">
        <option value="rrpp">RRPP (+20, horario, VCP/alrededores)</option>
        <option value="dueno">Dueño / Encargado (sin restricciones)</option>
      </select>
      <label>Nombres (uno por línea)</label>
      <textarea id="nuevosNombres" placeholder="Juan Pérez
María López
..."></textarea>
      <button class="btn-primary" id="btnAgregarLista">+ Agregar a la lista</button>
      <div class="status-msg" id="cargaStatus"></div>
    </div>

    <div class="card">
      <h2>Pendientes de esta noche (<span id="totalPendientes">0</span>)</h2>
      <div id="listaPendientes"><div class="muted">Sin gente cargada todavía.</div></div>
    </div>
  </div>

  <!-- VISTA PUERTA -->
  <div class="view" id="view-puerta">
    <div class="card" id="puertaScanCard">
      <h2>Fiscalizar ingreso</h2>
      <video id="video" muted playsinline style="display:none;"></video>
      <button class="btn-primary" id="btnEscanear">📷 Escanear DNI</button>
      <button class="btn-secondary" id="btnTorch" style="display:none;">🔦 Linterna</button>
      <button class="btn-secondary" id="btnBuscarManual">🔍 Buscar por nombre (si falla el escaneo)</button>
      <div id="buscarManualBox" style="display:none;">
        <label>Nombre</label>
        <input type="text" id="inputBuscar" placeholder="Escribí para buscar...">
        <div id="resultadosBusqueda"></div>
      </div>
      <div class="status-msg" id="scanStatus"></div>
    </div>

    <div class="card" id="candidatoCard" style="display:none;">
      <h2>Datos encontrados</h2>
      <div id="candidatoInfo"></div>
      <div id="candidatoChecklist"></div>
      <button class="btn-primary" id="btnConfirmarIngreso">✅ Confirmar ingreso</button>
      <button class="btn-secondary" id="btnCancelarCandidato">Cancelar</button>
    </div>
  </div>

  <!-- VISTA RESUMEN -->
  <div class="view" id="view-resumen">
    <div class="card">
      <h2>Ingresos en vivo</h2>
      <div class="resumen-row">
        <strong>Total ingresado</strong>
        <span class="resumen-count" id="totalIngresado">0</span>
      </div>
    </div>
    <div class="card">
      <h2>Por RRPP / dueño</h2>
      <div id="resumenPorResponsable"><div class="muted">Todavía no hay ingresos.</div></div>
    </div>
  </div>

</main>

<div class="tabbar">
  <button class="tab-btn active" data-view="carga"><span class="ico">📋</span>Carga</button>
  <button class="tab-btn" data-view="puerta"><span class="ico">🚪</span>Puerta</button>
  <button class="tab-btn" data-view="resumen"><span class="ico">📊</span>Resumen</button>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase (compat SDK, sin build tools) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<!-- ZXing para escaneo de DNI (PDF417) -->
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>

<script>
/* ---------- Firebase init ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyDYjdQw1YS2fGOb5EmwNSk8X-mGOtlUduQ",
  authDomain: "zebra-puerta.firebaseapp.com",
  projectId: "zebra-puerta",
  storageBucket: "zebra-puerta.firebasestorage.app",
  messagingSenderId: "953302953272",
  appId: "1:953302953272:web:ffea2258d872b34a6d25cd"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ---------- Estado global ---------- */
let evento = { nombreEvento: '', fecha: '', horaCorte: '02:00' };
let invitados = []; // cache local, sincronizado en vivo
let candidato = null; // { invitadoId, nombreCompleto, responsable, tipo, edad, dniRaw, matchScore }

/* ---------- Utils ---------- */
function normalizar(str) {
  return (str || '')
    .toString()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase()
    .replace(/[^a-z0-9\s]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}
function tokens(str) { return normalizar(str).split(' ').filter(Boolean); }

function scoreMatch(tokensA, tokensB) {
  if (!tokensA.length || !tokensB.length) return 0;
  const [shorter, longer] = tokensA.length <= tokensB.length ? [tokensA, tokensB] : [tokensB, tokensA];
  let hits = 0;
  shorter.forEach(t => { if (longer.includes(t)) hits++; });
  return hits / shorter.length;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function calcularEdad(fechaDDMMYYYY) {
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec((fechaDDMMYYYY || '').trim());
  if (!m) return null;
  const [_, dd, mm, yyyy] = m;
  const nacimiento = new Date(Number(yyyy), Number(mm) - 1, Number(dd));
  if (isNaN(nacimiento.getTime())) return null;
  const hoy = new Date();
  let edad = hoy.getFullYear() - nacimiento.getFullYear();
  const noCumplioAun = hoy.getMonth() < nacimiento.getMonth() ||
    (hoy.getMonth() === nacimiento.getMonth() && hoy.getDate() < nacimiento.getDate());
  if (noCumplioAun) edad--;
  return edad;
}

function excedeHorario(horaCorteStr) {
  if (!horaCorteStr) return false;
  const now = new Date();
  const h = now.getHours(), min = now.getMinutes();
  if (h >= 12) return false; // tarde/noche, todavía no llegó el corte de la madrugada
  const parts = horaCorteStr.split(':').map(Number);
  const corteMin = parts[0] * 60 + (parts[1] || 0);
  const nowMin = h * 60 + min;
  return nowMin > corteMin;
}

function parseDniPdf417(raw) {
  const parts = raw.split('@');
  return {
    tramite: parts[0] || '',
    apellido: parts[1] || '',
    nombre: parts[2] || '',
    sexo: parts[3] || '',
    dni: parts[4] || '',
    ejemplar: parts[5] || '',
    fechaNacimiento: parts[6] || '',
    fechaEmision: parts[7] || '',
    raw
  };
}

/* ---------- Tabs ---------- */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-' + btn.dataset.view).classList.add('active');
  });
});
document.getElementById('view-carga').classList.add('active');

/* ---------- Config del evento ---------- */
db.collection('config').doc('evento').onSnapshot(doc => {
  if (doc.exists) {
    evento = doc.data();
    document.getElementById('cfgNombre').value = evento.nombreEvento || '';
    document.getElementById('cfgHora').value = evento.horaCorte || '02:00';
    document.getElementById('eventoInfo').textContent =
      (evento.nombreEvento || 'Sin nombre') + ' · corte RRPP ' + (evento.horaCorte || '--:--');
  } else {
    document.getElementById('eventoInfo').textContent = 'Configurá el evento en la pestaña Carga';
  }
});

document.getElementById('btnGuardarEvento').addEventListener('click', () => {
  const nombreEvento = document.getElementById('cfgNombre').value.trim();
  const horaCorte = document.getElementById('cfgHora').value;
  const fecha = new Date().toISOString().slice(0, 10);
  db.collection('config').doc('evento').set({ nombreEvento, horaCorte, fecha }, { merge: true })
    .then(() => {
      document.getElementById('cfgStatus').textContent = 'Evento guardado.';
      document.getElementById('cfgStatus').className = 'status-msg ok';
    })
    .catch(e => {
      document.getElementById('cfgStatus').textContent = 'Error: ' + e.message;
      document.getElementById('cfgStatus').className = 'status-msg err';
    });
});

/* ---------- Carga de listas ---------- */
document.getElementById('btnAgregarLista').addEventListener('click', () => {
  const responsable = document.getElementById('nuevoResponsable').value.trim();
  const tipo = document.getElementById('nuevoTipo').value;
  const raw = document.getElementById('nuevosNombres').value;
  const lineas = raw.split('\n').map(l => l.trim()).filter(Boolean);
  const statusEl = document.getElementById('cargaStatus');

  if (!responsable) {
    statusEl.textContent = 'Falta el nombre del responsable.';
    statusEl.className = 'status-msg err';
    return;
  }
  if (!lineas.length) {
    statusEl.textContent = 'Cargá al menos un nombre.';
    statusEl.className = 'status-msg err';
    return;
  }

  const batch = db.batch();
  lineas.forEach(nombreCompleto => {
    const ref = db.collection('invitados').doc();
    batch.set(ref, {
      nombreCompleto,
      responsable,
      tipo,
      estado: 'pendiente',
      horaIngreso: null,
      dni: null,
      edadCalculada: null,
      creadoEn: firebase.firestore.FieldValue.serverTimestamp()
    });
  });
  batch.commit().then(() => {
    statusEl.textContent = lineas.length + ' persona(s) agregada(s) a la lista de ' + responsable + '.';
    statusEl.className = 'status-msg ok';
    document.getElementById('nuevosNombres').value = '';
  }).catch(e => {
    statusEl.textContent = 'Error: ' + e.message;
    statusEl.className = 'status-msg err';
  });
});

function renderPendientes() {
  const pendientes = invitados.filter(i => i.estado === 'pendiente');
  document.getElementById('totalPendientes').textContent = pendientes.length;
  const cont = document.getElementById('listaPendientes');
  if (!pendientes.length) {
    cont.innerHTML = '<div class="muted">Sin gente cargada todavía.</div>';
    return;
  }
  const grupos = {};
  pendientes.forEach(p => {
    const key = p.responsable + '||' + p.tipo;
    if (!grupos[key]) grupos[key] = [];
    grupos[key].push(p);
  });
  let html = '';
  Object.keys(grupos).sort().forEach(key => {
    const [responsable, tipo] = key.split('||');
    const items = grupos[key];
    html += `<div class="responsable-group"><h3>${escapeHtml(responsable)} <span class="tag ${tipo === 'rrpp' ? 'tag-rrpp' : 'tag-dueno'}">${tipo === 'rrpp' ? 'RRPP' : 'DUEÑO'}</span> · ${items.length}</h3>`;
    items.forEach(p => {
      html += `<div class="list-item"><span>${escapeHtml(p.nombreCompleto)}</span><button class="x-btn" data-id="${p.id}" title="Quitar">✕</button></div>`;
    });
    html += '</div>';
  });
  cont.innerHTML = html;
  cont.querySelectorAll('.x-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      db.collection('invitados').doc(btn.dataset.id).delete();
    });
  });
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

/* ---------- Sincronización en vivo de invitados ---------- */
db.collection('invitados').onSnapshot(snap => {
  invitados = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderPendientes();
  renderResumen();
  if (document.getElementById('buscarManualBox').style.display !== 'none') {
    renderBusquedaManual();
  }
});

/* ---------- Resumen en vivo ---------- */
function renderResumen() {
  const ingresados = invitados.filter(i => i.estado === 'ingresado');
  document.getElementById('totalIngresado').textContent = ingresados.length;
  const cont = document.getElementById('resumenPorResponsable');
  if (!ingresados.length) {
    cont.innerHTML = '<div class="muted">Todavía no hay ingresos.</div>';
    return;
  }
  const counts = {};
  ingresados.forEach(i => {
    const key = i.responsable + '||' + i.tipo;
    counts[key] = (counts[key] || 0) + 1;
  });
  const rows = Object.keys(counts).map(key => {
    const [responsable, tipo] = key.split('||');
    return { responsable, tipo, count: counts[key] };
  }).sort((a, b) => b.count - a.count);
  cont.innerHTML = rows.map(r =>
    `<div class="resumen-row"><span>${escapeHtml(r.responsable)} <span class="tag ${r.tipo === 'rrpp' ? 'tag-rrpp' : 'tag-dueno'}">${r.tipo === 'rrpp' ? 'RRPP' : 'DUEÑO'}</span></span><span class="resumen-count">${r.count}</span></div>`
  ).join('');
}

/* ---------- Búsqueda manual (fallback) ---------- */
document.getElementById('btnBuscarManual').addEventListener('click', () => {
  const box = document.getElementById('buscarManualBox');
  box.style.display = box.style.display === 'none' ? 'block' : 'none';
  if (box.style.display === 'block') renderBusquedaManual();
});
document.getElementById('inputBuscar').addEventListener('input', renderBusquedaManual);

function renderBusquedaManual() {
  const q = normalizar(document.getElementById('inputBuscar').value);
  const cont = document.getElementById('resultadosBusqueda');
  if (!q) { cont.innerHTML = ''; return; }
  const pendientes = invitados.filter(i => i.estado === 'pendiente');
  const results = pendientes.filter(p => normalizar(p.nombreCompleto).includes(q)).slice(0, 8);
  if (!results.length) {
    cont.innerHTML = '<div class="muted" style="margin-top:6px;">Sin coincidencias.</div>';
    return;
  }
  cont.innerHTML = results.map(p =>
    `<div class="search-result" data-id="${p.id}">${escapeHtml(p.nombreCompleto)} <span class="tag ${p.tipo === 'rrpp' ? 'tag-rrpp' : 'tag-dueno'}">${p.tipo === 'rrpp' ? 'RRPP' : 'DUEÑO'}</span> · ${escapeHtml(p.responsable)}</div>`
  ).join('');
  cont.querySelectorAll('.search-result').forEach(el => {
    el.addEventListener('click', () => {
      const inv = invitados.find(i => i.id === el.dataset.id);
      document.getElementById('buscarManualBox').style.display = 'none';
      document.getElementById('scanStatus').textContent = 'Seleccionado: ' + inv.nombreCompleto + '. Ahora escaneá su DNI para confirmar identidad y edad.';
      document.getElementById('scanStatus').className = 'status-msg';
      preseleccion = inv; // se completará con el escaneo
      iniciarEscaneo();
    });
  });
}

/* ---------- Escaneo DNI (ZXing) ---------- */
let preseleccion = null; // invitado elegido manualmente, pendiente de escaneo
const { BrowserMultiFormatReader, BarcodeFormat, DecodeHintType } = ZXing;
const hints = new Map();
hints.set(DecodeHintType.POSSIBLE_FORMATS, [BarcodeFormat.PDF_417]);
const reader = new BrowserMultiFormatReader(hints);
let currentStream = null;

document.getElementById('btnEscanear').addEventListener('click', () => { preseleccion = null; iniciarEscaneo(); });

function iniciarEscaneo() {
  const video = document.getElementById('video');
  const statusEl = document.getElementById('scanStatus');
  video.style.display = 'block';
  statusEl.textContent = 'Pidiendo acceso a la cámara...';
  statusEl.className = 'status-msg';

  reader.decodeFromConstraints(
    { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } },
    video,
    (result, err) => {
      if (result) {
        const parsed = parseDniPdf417(result.getText());
        onDniEscaneado(parsed);
      }
    }
  ).then(() => {
    statusEl.textContent = 'Cámara activa. Apuntá al código de barras de atrás del DNI.';
    currentStream = video.srcObject;
    activarLinterna();
  }).catch(e => {
    statusEl.textContent = 'Error al acceder a la cámara: ' + e.message;
    statusEl.className = 'status-msg err';
  });
}

function activarLinterna() {
  if (!currentStream) return;
  const track = currentStream.getVideoTracks()[0];
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  const btnTorch = document.getElementById('btnTorch');
  if (caps.torch) {
    btnTorch.style.display = 'block';
    let on = false;
    btnTorch.onclick = () => {
      on = !on;
      track.applyConstraints({ advanced: [{ torch: on }] }).catch(() => {});
      btnTorch.textContent = on ? '🔦 Apagar linterna' : '🔦 Linterna';
    };
  }
}

function detenerEscaneo() {
  try { reader.reset(); } catch (e) {}
  document.getElementById('video').style.display = 'none';
  document.getElementById('btnTorch').style.display = 'none';
}

function onDniEscaneado(dni) {
  detenerEscaneo();
  const edad = calcularEdad(dni.fechaNacimiento);
  const statusEl = document.getElementById('scanStatus');

  if (preseleccion) {
    // ya eligieron manualmente a quién es, solo falta la edad/identidad del DNI
    mostrarCandidato(preseleccion, edad, dni, 1);
    statusEl.textContent = '';
    return;
  }

  // matching automático contra pendientes
  const dniTokens = tokens(dni.apellido + ' ' + dni.nombre);
  const pendientes = invitados.filter(i => i.estado === 'pendiente');
  const candidatos = pendientes.map(p => ({ p, score: scoreMatch(dniTokens, tokens(p.nombreCompleto)) }))
    .filter(c => c.score >= 0.5)
    .sort((a, b) => b.score - a.score);

  if (!candidatos.length) {
    statusEl.textContent = '❌ No aparece en ninguna lista (' + dni.apellido + ' ' + dni.nombre + ', ' + (edad !== null ? edad + ' años' : 'edad no calculada') + ').';
    statusEl.className = 'status-msg err';
    return;
  }
  mostrarCandidato(candidatos[0].p, edad, dni, candidatos[0].score);
}

function mostrarCandidato(inv, edad, dni, score) {
  candidato = { invitado: inv, edad, dni, score };
  document.getElementById('candidatoCard').style.display = 'block';
  const tipo = inv.tipo;
  const infoEl = document.getElementById('candidatoInfo');
  infoEl.innerHTML = `
    <div class="list-item"><span>Nombre en lista</span><strong>${escapeHtml(inv.nombreCompleto)}</strong></div>
    <div class="list-item"><span>Responsable</span><strong>${escapeHtml(inv.responsable)} <span class="tag ${tipo === 'rrpp' ? 'tag-rrpp' : 'tag-dueno'}">${tipo === 'rrpp' ? 'RRPP' : 'DUEÑO'}</span></strong></div>
    ${dni.apellido ? `<div class="list-item"><span>DNI escaneado</span><strong>${escapeHtml(dni.apellido + ' ' + dni.nombre)}</strong></div>` : ''}
    <div class="list-item"><span>Edad</span><strong>${edad !== null ? edad + ' años' : 'no calculada'}</strong></div>
  `;

  const checklistEl = document.getElementById('candidatoChecklist');
  let bloqueaIngreso = false;
  let html = '';

  if (tipo === 'rrpp') {
    const edadOk = edad !== null && edad >= 20;
    html += `<div class="list-item"><span>Requisito +20 años</span><span class="badge ${edadOk ? 'badge-ok' : 'badge-no'}">${edadOk ? 'OK' : 'NO CUMPLE'}</span></div>`;
    if (!edadOk) bloqueaIngreso = true;

    const excedido = excedeHorario(evento.horaCorte);
    html += `<div class="list-item"><span>Horario (corte ${escapeHtml(evento.horaCorte || '--:--')})</span><span class="badge ${!excedido ? 'badge-ok' : 'badge-no'}">${!excedido ? 'OK' : 'FUERA DE HORARIO'}</span></div>`;
    if (excedido) bloqueaIngreso = true;

    html += `<div class="checkline"><input type="checkbox" id="chkVcp"><label for="chkVcp" style="margin:0;">Confirmo verbalmente que es de Carlos Paz o alrededores</label></div>`;
  } else {
    html += `<div class="muted">Lista de dueño/encargado — sin restricciones de edad ni horario.</div>`;
  }
  checklistEl.innerHTML = html;

  const btnConfirmar = document.getElementById('btnConfirmarIngreso');
  function actualizarBoton() {
    if (tipo === 'rrpp') {
      const chk = document.getElementById('chkVcp');
      btnConfirmar.disabled = bloqueaIngreso || !chk.checked;
    } else {
      btnConfirmar.disabled = false;
    }
  }
  actualizarBoton();
  if (tipo === 'rrpp') {
    document.getElementById('chkVcp').addEventListener('change', actualizarBoton);
  }
}

document.getElementById('btnCancelarCandidato').addEventListener('click', () => {
  candidato = null;
  preseleccion = null;
  document.getElementById('candidatoCard').style.display = 'none';
});

document.getElementById('btnConfirmarIngreso').addEventListener('click', () => {
  if (!candidato) return;
  const { invitado, edad, dni } = candidato;
  db.collection('invitados').doc(invitado.id).update({
    estado: 'ingresado',
    horaIngreso: Date.now(),
    edadCalculada: edad,
    dni: dni ? { apellido: dni.apellido, nombre: dni.nombre, dni: dni.dni } : null
  }).then(() => {
    showToast('✅ Ingreso confirmado: ' + invitado.nombreCompleto);
    candidato = null;
    preseleccion = null;
    document.getElementById('candidatoCard').style.display = 'none';
    document.getElementById('scanStatus').textContent = '';
  }).catch(e => {
    showToast('Error: ' + e.message);
  });
});
</script>
</body>
